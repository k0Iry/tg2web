name: Trigger auto deployment for tg2web

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/tg2web-AutoDeployTrigger-ca620c89-905b-4380-9ab2-09f5fc7be76e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TG2WEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TG2WEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TG2WEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: tg2webacr2026.azurecr.io
          registryUsername: ${{ secrets.TG2WEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TG2WEB_REGISTRY_PASSWORD }}
          containerAppName: tg2web
          resourceGroup: tg2web
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


